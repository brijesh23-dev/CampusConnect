name: Node.js CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  backend-test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create test environment
        run: |
          echo "MONGO_URI=mongodb://127.0.0.1:27017/campusconnect_test" > .env.test
          echo "CLOUDINARY_CLOUD_NAME=test" >> .env.test
          echo "CLOUDINARY_API_KEY=test" >> .env.test
          echo "CLOUDINARY_API_SECRET=test" >> .env.test
          echo "JWT_SECRET=test_jwt_secret" >> .env.test

      - name: Run tests
        run: npm test
